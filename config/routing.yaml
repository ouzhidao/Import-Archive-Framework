routes:
  - port: 青岛
    agent_id: agent_qd_01        # 青岛代理（1 家）
    contact: ""                  # TODO: 用户填（邮箱/微信标识）
  - port: 大连
    agent_id: agent_dl_a         # 大连代理 A
    contact: ""                  # TODO: 用户填
  - port: 大连
    agent_id: agent_dl_b         # 大连代理 B
